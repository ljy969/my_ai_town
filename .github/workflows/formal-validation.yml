name: formal-validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: formal-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  guards:
    name: 静态与打包守卫
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 运行守卫
        run: tools/guards/run_guards.sh

  game-import:
    name: Godot project import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Source tree must stay clean after import
        run: test -z "$(git status --porcelain)"

  windows-checkout:
    name: Windows checkout with default path limits
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Use default Windows path limits
        shell: pwsh
        run: git config --global core.longpaths false
      - uses: actions/checkout@v4
      - name: Verify checkout paths
        run: python tools/guards/checkout_path_check.py
